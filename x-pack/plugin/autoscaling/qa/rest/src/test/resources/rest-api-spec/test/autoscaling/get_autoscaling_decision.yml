---
"Test get empty autoscaling decision":
  - do:
      autoscaling.get_autoscaling_decision: {}

  - match: { "decisions": [] }

---
"Test get always autoscaling decision":
  - do:
      autoscaling.put_autoscaling_policy:
        name: my_autoscaling_policy
        body:
          policy:
            deciders:
              fixed:
                storage: 1337
                memory: 7331
                nodes: true

  - match: { "acknowledged": true }

  - do:
      autoscaling.get_autoscaling_decision: {}

  - match: { tiers.0.tier: my_autoscaling_policy }
  - match: { tiers.0.required_capacity.tier.storage: 1337 }
  - match: { tiers.0.required_capacity.tier.storage: 7331 }
  - match: { tiers.0.required_capacity.node.storage: 1337 }
  - match: { tiers.0.required_capacity.node.storage: 7331 }
  - match: { decisions.0.my_autoscaling_policy.decisions.0.name: fixed }
  - match: { decisions.0.my_autoscaling_policy.decisions.0.required_capacity.tier.storage: 1337 }
  - match: { decisions.0.my_autoscaling_policy.decisions.0.required_capacity.tier.memory: 7331 }
  - match: { decisions.0.my_autoscaling_policy.decisions.0.required_capacity.node.storage: 1337 }
  - match: { decisions.0.my_autoscaling_policy.decisions.0.required_capacity.node.memory: 7331 }
  - match: { decisions.0.my_autoscaling_policy.decisions.0.reason_summary: fixed }

  # test cleanup
  - do:
      autoscaling.delete_autoscaling_policy:
        name: my_autoscaling_policy
